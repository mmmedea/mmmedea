<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <!-- Premium Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    
    <!-- Ambient Light Orbs -->
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#030014" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#030014" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Developer Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.04"/>
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.02" />
    </pattern>
  </defs>

  <!-- Embedded CSS Animations -->
  <style>
    .orb-1 { animation: drift 10s ease-in-out infinite alternate; }
    .orb-2 { animation: driftReverse 12s ease-in-out infinite alternate; }
    
    @keyframes drift {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.6; }
      100% { transform: scale(1.2) translate(40px, 20px); opacity: 1; }
    }
    @keyframes driftReverse {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.5; }
      100% { transform: scale(1.15) translate(-40px, -20px); opacity: 0.9; }
    }

    .float-card { animation: float 6s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    .laser-line { animation: scan 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    @keyframes scan {
      0% { transform: translateX(200px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(800px); opacity: 0; }
    }

    .glow-text { animation: textPulse 3s ease-in-out infinite alternate; }
    @keyframes textPulse {
      0% { filter: drop-shadow(0px 0px 2px rgba(168, 85, 247, 0.2)); }
      100% { filter: drop-shadow(0px 0px 15px rgba(168, 85, 247, 0.6)); }
    }
  </style>

  <!-- Deep Midnight Base & Grid -->
  <rect width="1200" height="280" fill="#030014"/>
  <rect width="1200" height="280" fill="url(#grid)"/>

  <!-- Animated Ambient Orbs -->
  <circle class="orb-1" cx="300" cy="140" r="300" fill="url(#glowViolet)" />
  <circle class="orb-2" cx="900" cy="140" r="250" fill="url(#glowMagenta)" />

  <!-- Animated Floating Group -->
  <g class="float-card">
    <!-- Glassmorphism Card Base -->
    <rect x="200" y="65" width="800" height="150" rx="16" fill="#ffffff" fill-opacity="0.02" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Animated Scanning Laser on top edge -->
    <rect class="laser-line" x="0" y="65" width="150" height="2" rx="1" fill="#e9d5ff" style="filter: drop-shadow(0px 0px 6px #a855f7);"/>

    <!-- Premium Animated Typography -->
    <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="5" class="glow-text">MARICRIS M. MARTINEZ</text>
    
    <!-- Minimalist Accent Divider -->
    <rect x="550" y="175" width="100" height="4" rx="2" fill="#a855f7" opacity="0.9"/>
  </g>
</svg>
